name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 每日香港時間 9:00 自動生成新文章並部署
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'

      - name: Checkout Theme
        run: |
          git clone https://github.com/adityatelange/hugo-PaperMod.git themes/PaperMod

      - name: Generate New Article
        run: |
          python3 scripts/daily_article.py

      - name: Build Hugo
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
